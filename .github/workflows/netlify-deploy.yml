# ينشر الموقع على Netlify مباشرة من GitHub بدون ربط المستودع في Netlify.
# يحتاج سرّين في: Settings > Secrets and variables > Actions
#   NETLIFY_AUTH_TOKEN  (توكن شخصي من Netlify)
#   NETLIFY_SITE_ID     (رقم الموقع)
name: Deploy to Netlify

on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli@17 deploy --dir=out --prod --message "GitHub ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
